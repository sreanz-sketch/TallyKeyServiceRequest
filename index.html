<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TK Service">
<title>TallyKey Service Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --red: #ef4444; --red-bg: #fef2f2; --red-border: #fecaca;
    --amber: #f59e0b; --amber-bg: #fffbeb; --amber-border: #fde68a;
    --green: #10b981; --green-bg: #f0fdf4; --green-border: #bbf7d0;
    --indigo: #6366f1;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f1f5f9;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--safe-bottom) + 16px);
    min-height: 100vh;
  }

 
  /* Login screen */
  #login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px 24px; text-align: center;
  }
  .login-logo { font-size: 40px; margin-bottom: 16px; }
  .login-title { font-size: 24px; font-weight: 800; color: #0f172a; letter-spacing: -.02em; margin-bottom: 6px; }
  .login-sub { font-size: 14px; color: #64748b; margin-bottom: 32px; line-height: 1.5; }
  .ms-btn {
    display: flex; align-items: center; gap: 10px;
    background: #2f6bc4; color: #fff; border: none; border-radius: 12px;
    padding: 14px 24px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit; width: 100%; max-width: 280px;
    justify-content: center;
  }
  .ms-btn:active { opacity: .85; }
  .ms-logo { width: 20px; height: 20px; flex-shrink: 0; }

  /* App */
  #app { display: none; }

  /* Header */
  .header {
    background: #fff; border-bottom: 1px solid #e2e8f0;
    padding: 14px 16px 12px;
    position: sticky; top: 0; z-index: 50;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .header-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; display: flex; align-items: center; gap: 5px; margin-bottom: 1px; }
  .header-dot { width: 7px; height: 7px; border-radius: 50%; background: #3b82f6; flex-shrink: 0; }
  .header-title { font-size: 20px; font-weight: 800; color: #0f172a; letter-spacing: -.02em; }
  .header-sub { font-size: 11px; color: #94a3b8; margin-top: 1px; }
  .header-btns { display: flex; gap: 8px; }
  .icon-btn {
    background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px;
    padding: 6px 10px; font-size: 13px; font-weight: 600; color: #475569;
    cursor: pointer; white-space: nowrap;
  }
  .icon-btn:active { background: #f1f5f9; }
  .spinning { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Stats */
  .stats { display: flex; gap: 8px; padding: 12px 16px 0; }
  .stat { flex: 1; background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px 8px; text-align: center; cursor: pointer; }
  .stat.active-open       { border-color: var(--red);   background: #fff5f5; }
  .stat.active-inprogress { border-color: var(--amber); background: #fffdf0; }
  .stat.active-closed     { border-color: var(--green); background: #f0fdf8; }
  .stat.active-all        { border-color: var(--indigo); background: #f5f3ff; }
  .stat-num { font-size: 22px; font-weight: 800; color: #0f172a; line-height: 1; }
  .stat.active-open .stat-num       { color: var(--red); }
  .stat.active-inprogress .stat-num { color: var(--amber); }
  .stat.active-closed .stat-num     { color: var(--green); }
  .stat.active-all .stat-num        { color: var(--indigo); }
  .stat-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; margin-top: 2px; }

  /* Search */
  .search-wrap { padding: 10px 16px 4px; }
  .search-wrap input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1.5px solid #e2e8f0; background: #fff;
    font-size: 14px; color: #0f172a; outline: none; font-family: inherit;
  }
  .search-wrap input:focus { border-color: var(--indigo); }

  /* List */
  .list { padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }

  /* Card */
  .card { background: #fff; border-radius: 12px; border: 1.5px solid #e2e8f0; overflow: hidden; }
  .card.open-card       { border-color: var(--red-border); box-shadow: 0 1px 8px rgba(239,68,68,.08); }
  .card.inprogress-card { border-color: var(--amber-border); }
  .card.closed-card     { opacity: .65; }
  .card-header { padding: 12px 14px; cursor: pointer; }
  .card-subject { font-size: 13px; font-weight: 700; color: #0f172a; line-height: 1.3; margin-bottom: 4px; }
  .card-meta { font-size: 11px; color: #94a3b8; }
  .card-meta strong { color: #475569; font-weight: 600; }
  .card-reason { font-size: 11px; color: #b0bec5; font-style: italic; margin-top: 4px; }
  .card-footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .status-wrap { position: relative; display: inline-block; }
  .status-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; border: 1.5px solid;
    cursor: pointer; font-family: inherit;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .status-open       { color: var(--red);   background: var(--red-bg);   border-color: var(--red-border); }
  .status-inprogress { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-border); }
  .status-closed     { color: var(--green); background: var(--green-bg); border-color: var(--green-border); }
  .dropdown {
    position: absolute; bottom: calc(100% + 4px); right: 0; z-index: 99;
    background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); min-width: 145px; overflow: hidden; display: none;
  }
  .dropdown.show { display: block; }
  .dropdown-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border: none; background: #fff; cursor: pointer; font-family: inherit;
    font-size: 13px; color: #374151; width: 100%; text-align: left;
  }
  .dropdown-item:active { background: #f8fafc; }
  .ai-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 20px; border: 1.5px dashed;
    font-size: 10px; font-weight: 600; cursor: pointer; font-family: inherit; background: transparent;
  }
  .card-body { padding: 0 14px 14px; border-top: 1px solid #f1f5f9; display: none; }
  .card-body.open { display: block; }
  .card-summary { padding-top: 10px; font-size: 13px; color: #475569; line-height: 1.6; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .action-btn {
    padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; border: 1.5px solid; text-decoration: none; display: inline-block;
  }
  .btn-outlook { background: #f8fafc; color: #374151; border-color: #e2e8f0; }
  .btn-close   { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
  .btn-reopen  { background: var(--red-bg);   color: var(--red);   border-color: var(--red-border); }

  /* Error / empty */
  .notice {
    margin: 12px 16px 0; padding: 12px 14px; border-radius: 10px;
    font-size: 13px; line-height: 1.5; display: none;
  }
  .notice.show { display: block; }
  .notice.error { background: #fef2f2; border: 1.5px solid #fecaca; color: #dc2626; }
  .notice.info  { background: #f0f9ff; border: 1.5px solid #bae6fd; color: #0369a1; }
  .empty { text-align: center; padding: 60px 0; color: #94a3b8; font-size: 14px; }
  .empty-icon { font-size: 28px; margin-bottom: 8px; }
</style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen">
  <div class="login-logo">📬</div>
  <div class="login-title">TallyKey Service Tracker</div>
  <div class="login-sub">Sign in with your Microsoft account to automatically load and track emails from service@tallykey.dk</div>
  <button class="ms-btn" onclick="signIn()">
    <svg class="ms-logo" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
      <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
      <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
      <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
    </svg>
    Sign in with Microsoft
  </button>
</div>

<!-- Main app -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-label"><span class="header-dot"></span> TallyKey · Service Inbox</div>
        <div class="header-title">Email Tracker</div>
        <div class="header-sub" id="header-sub">service@tallykey.dk</div>
      </div>
      <div class="header-btns">
        <button class="icon-btn" id="refresh-btn" onclick="loadEmails()">↻ Refresh</button>
        <button class="icon-btn" onclick="signOut()">Sign out</button>
      </div>
    </div>
  </div>

  <div class="notice error" id="error-box"></div>

  <div class="stats">
    <div class="stat" id="stat-open" onclick="setFilter('open')">
      <div class="stat-num" id="count-open">—</div>
      <div class="stat-label">Open</div>
    </div>
    <div class="stat" id="stat-inprogress" onclick="setFilter('inprogress')">
      <div class="stat-num" id="count-inprogress">—</div>
      <div class="stat-label">In Prog</div>
    </div>
    <div class="stat" id="stat-closed" onclick="setFilter('closed')">
      <div class="stat-num" id="count-closed">—</div>
      <div class="stat-label">Closed</div>
    </div>
    <div class="stat" id="stat-all" onclick="setFilter('all')">
      <div class="stat-num" id="count-all">—</div>
      <div class="stat-label">All</div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="search" id="search" placeholder="Search…" oninput="render()" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <div class="list" id="list"><div class="empty"><div class="empty-icon">⟳</div>Loading emails…</div></div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const CLIENT_ID    = 'd88cde83-01c8-4a87-a85d-22f81eaf2ee1';
const SERVICE_ADDR = 'service@tallykey.dk';
const SCOPES       = 'Mail.Read offline_access';
const REDIRECT_URI = location.href.split('?')[0].split('#')[0];

// ── Auth (PKCE) ──────────────────────────────────────────────────────────────
function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function pkce() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return { verifier, challenge: b64url(hash) };
}

async function signIn() {
  const { verifier, challenge } = await pkce();
  localStorage.setItem('pkce_verifier', verifier);
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    response_mode: 'query',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    prompt: 'select_account',
  });
  location.href = `https://login.microsoftonline.com/51a41c2a-3820-458f-b160-efccf08936f4/oauth2/v2.0/authorize?${params}`;
}

async function exchangeCode(code) {
  const verifier = localStorage.getItem('pkce_verifier');
  const res = await fetch('https://login.microsoftonline.com/51a41c2a-3820-458f-b160-efccf08936f4/oauth2/v2.0/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'authorization_code',
      code, redirect_uri: REDIRECT_URI,
      code_verifier: verifier,
    }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error_description || data.error);
  saveTokens(data);
  return data.access_token;
}

async function refreshAccessToken() {
  const rt = localStorage.getItem('tk_refresh_token');
  if (!rt) throw new Error('No refresh token — please sign in again.');
  const res = await fetch('https://login.microsoftonline.com/51a41c2a-3820-458f-b160-efccf08936f4/oauth2/v2.0/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'refresh_token',
      refresh_token: rt,
      scope: SCOPES,
    }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error_description || data.error);
  saveTokens(data);
  return data.access_token;
}

function saveTokens(data) {
  const exp = Date.now() + (data.expires_in - 60) * 1000;
  localStorage.setItem('tk_access_token', data.access_token);
  localStorage.setItem('tk_token_expiry', exp);
  if (data.refresh_token) localStorage.setItem('tk_refresh_token', data.refresh_token);
}

async function getToken() {
  const exp = parseInt(localStorage.getItem('tk_token_expiry') || '0');
  if (Date.now() < exp) return localStorage.getItem('tk_access_token');
  return refreshAccessToken();
}

function signOut() {
  ['tk_access_token','tk_token_expiry','tk_refresh_token'].forEach(k => localStorage.removeItem(k));
  location.href = `https://login.microsoftonline.com/51a41c2a-3820-458f-b160-efccf08936f4/oauth2/v2.0/logout?post_logout_redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
}

// ── Status storage ───────────────────────────────────────────────────────────
const STATUS = {
  open:       { label:'Open',        color:'#ef4444', bg:'#fef2f2', border:'#fecaca' },
  inprogress: { label:'In Progress', color:'#f59e0b', bg:'#fffbeb', border:'#fde68a' },
  closed:     { label:'Closed',      color:'#10b981', bg:'#f0fdf4', border:'#bbf7d0' },
};

function loadStatuses() {
  try { return JSON.parse(localStorage.getItem('tk_statuses') || '{}'); } catch { return {}; }
}
function saveStatuses(s) {
  try { localStorage.setItem('tk_statuses', JSON.stringify(s)); } catch {} 
}

// ── App state ────────────────────────────────────────────────────────────────
let emails   = [];
let statuses = loadStatuses();
let filter   = 'open';
let expanded = {};

// ── Microsoft Graph fetch ────────────────────────────────────────────────────
async function graphGet(url, token) {
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Graph error ${res.status}`);
  }
  return res.json();
}

async function fetchEmails() {
  const token = await getToken();

  // Search both sent and received involving service@tallykey.dk
  // Use $search across all folders
  const query = encodeURIComponent(`"${SERVICE_ADDR}"`);
  const fields = 'id,subject,sender,from,receivedDateTime,bodyPreview,isRead,webLink';
  const url = `https://graph.microsoft.com/v1.0/me/messages?$search=${query}&$top=50&$select=${fields}&$orderby=receivedDateTime desc`;

  const data = await graphGet(url, token);
  return (data.value || []).filter(e => {
    const from = e.from?.emailAddress?.address?.toLowerCase() || '';
    const preview = (e.bodyPreview || '').toLowerCase();
    return from === SERVICE_ADDR.toLowerCase() || preview.includes(SERVICE_ADDR.toLowerCase());
  });
}

function normalise(raw) {
  return raw.map((e, i) => {
    const from = e.from?.emailAddress?.address || e.sender?.emailAddress?.address || 'unknown';
    return {
      id: e.id || `e${i}`,
      subject: e.subject || '(No subject)',
      sender: from,
      receivedDate: e.receivedDateTime
        ? new Date(e.receivedDateTime).toLocaleDateString('en-NZ', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })
        : '',
      summary: e.bodyPreview || '',
      webLink: e.webLink || '#',
      isRead: e.isRead !== false,
    };
  });
}

// ── AI triage via Anthropic API ──────────────────────────────────────────────
async function triageEmails(list) {
  if (!list.length) return list;
  // Restore saved statuses first; only triage unseen emails
  const unseen = list.filter(e => !statuses[e.id]);
  if (!unseen.length) return list;

  try {
    const summaries = unseen.map(e => ({
      id: e.id, subject: e.subject,
      preview: e.summary.slice(0, 300), sender: e.sender,
    }));
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `You triage emails for a service inbox (service@tallykey.dk — EV charging equipment).
Classify each as "open" (needs action), "inprogress" (being handled), or "closed" (resolved).
Return ONLY a JSON array: [{"id":"...","status":"open","reason":"brief reason"}]. No markdown.`,
        messages: [{ role: 'user', content: JSON.stringify(summaries) }],
      }),
    });
    const data = await res.json();
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    const suggestions = JSON.parse(text.replace(/```json|```/g, '').trim());
    suggestions.forEach(s => {
      if (!statuses[s.id]) statuses[s.id] = s.status || 'open';
    });
    saveStatuses(statuses);

    // store reasons temporarily for display
    const reasons = {};
    suggestions.forEach(s => { reasons[s.id] = s.reason; });
    return list.map(e => ({ ...e, aiReason: reasons[e.id] || null }));
  } catch (err) {
    console.warn('AI triage failed:', err);
    unseen.forEach(e => { if (!statuses[e.id]) statuses[e.id] = 'open'; });
    saveStatuses(statuses);
    return list;
  }
}

// ── Load + render ────────────────────────────────────────────────────────────
async function loadEmails() {
  const btn = document.getElementById('refresh-btn');
  btn.innerHTML = '<span class="spinning">↻</span> Loading';
  btn.disabled = true;
  showError('');

  try {
    const raw  = await fetchEmails();
    const norm = normalise(raw);
    emails     = await triageEmails(norm);
    const now  = new Date().toLocaleTimeString('en-NZ', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('header-sub').textContent = `service@tallykey.dk · ${now}`;
  } catch (err) {
    showError(err.message);
  }

  btn.innerHTML = '↻ Refresh';
  btn.disabled = false;
  render();
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg ? '⚠ ' + msg : '';
  box.classList.toggle('show', !!msg);
}

// ── UI helpers ───────────────────────────────────────────────────────────────
function setFilter(f) { filter = f; render(); }

function setStatus(id, s, e) {
  if (e) e.stopPropagation();
  statuses[id] = s;
  saveStatuses(statuses);
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
  render();
}

function toggleExpand(id) { expanded[id] = !expanded[id]; render(); }

function toggleDropdown(id, e) {
  e.stopPropagation();
  const dd = document.getElementById('dd-' + id);
  const was = dd.classList.contains('show');
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
  if (!was) dd.classList.add('show');
}

document.addEventListener('click', () =>
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'))
);

function render() {
  const q = document.getElementById('search').value.toLowerCase();

  const counts = { open:0, inprogress:0, closed:0, all:emails.length };
  emails.forEach(e => { const s = statuses[e.id] || 'open'; if (counts[s] !== undefined) counts[s]++; });

  ['open','inprogress','closed','all'].forEach(k => {
    document.getElementById('count-' + k).textContent = counts[k];
    const el = document.getElementById('stat-' + k);
    el.className = 'stat' + (filter === k ? ' active-' + k : '');
  });

  const visible = emails.filter(e => {
    const s = statuses[e.id] || 'open';
    return (filter === 'all' || s === filter) &&
      (!q || e.subject.toLowerCase().includes(q) ||
             e.sender.toLowerCase().includes(q) ||
             e.summary.toLowerCase().includes(q));
  });

  const list = document.getElementById('list');
  if (!visible.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">✓</div>No emails match this filter.</div>';
    return;
  }

  list.innerHTML = visible.map(e => {
    const s   = statuses[e.id] || 'open';
    const cfg = STATUS[s];
    const isExp = expanded[e.id];
    const safeId = e.id.replace(/[^a-zA-Z0-9_-]/g, '_');

    return `
    <div class="card ${s}-card">
      <div class="card-header" onclick="toggleExpand('${e.id}')">
        <div class="card-subject">${escHtml(e.subject)}</div>
        <div class="card-meta"><strong>${escHtml(e.sender)}</strong> · ${e.receivedDate}</div>
        ${e.aiReason ? `<div class="card-reason">✦ ${escHtml(e.aiReason)}</div>` : ''}
        <div class="card-footer-row">
          <div class="status-wrap" onclick="event.stopPropagation()">
            <button class="status-btn status-${s}" onclick="toggleDropdown('${safeId}',event)">
              <span class="status-dot" style="background:${cfg.color}"></span>
              ${cfg.label} <span style="font-size:9px;opacity:.7">▾</span>
            </button>
            <div class="dropdown" id="dd-${safeId}">
              ${Object.entries(STATUS).map(([k,c]) => `
                <button class="dropdown-item" onclick="setStatus('${e.id}','${k}',event)">
                  <span style="width:8px;height:8px;border-radius:50%;background:${c.color};display:inline-block;flex-shrink:0"></span>
                  ${c.label}
                </button>`).join('')}
            </div>
          </div>
          <span style="font-size:13px;color:#94a3b8">${isExp ? '▴' : '▾'}</span>
        </div>
      </div>
      <div class="card-body ${isExp ? 'open' : ''}">
        <div class="card-summary">${escHtml(e.summary)}</div>
        <div class="card-actions">
          <a href="${e.webLink}" target="_blank" class="action-btn btn-outlook">↗ Open in Outlook</a>
          ${s !== 'closed'
            ? `<button class="action-btn btn-close" onclick="setStatus('${e.id}','closed',event)">✓ Mark Closed</button>`
            : `<button class="action-btn btn-reopen" onclick="setStatus('${e.id}','open',event)">↩ Reopen</button>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  const params = new URLSearchParams(location.search);

  // Check for OAuth error response
  const oauthError = params.get('error');
  if (oauthError) {
    const desc = params.get('error_description') || oauthError;
    history.replaceState({}, '', REDIRECT_URI);
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    alert('Sign-in error: ' + decodeURIComponent(desc.replace(/\+/g,' ')));
    return;
  }

  // Handle auth code
  const code = params.get('code');
  if (code) {
    // Show loading state on login screen while exchanging
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    try {
      await exchangeCode(code);
      history.replaceState({}, '', REDIRECT_URI);
    } catch (err) {
      history.replaceState({}, '', REDIRECT_URI);
      document.getElementById('login-screen').style.display = 'flex';
      alert('Sign-in failed: ' + err.message);
      return;
    }
  }

  // Check if we have tokens
  const hasToken = localStorage.getItem('tk_refresh_token') || localStorage.getItem('tk_access_token');
  if (hasToken) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await loadEmails();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
}

boot();
</script>
